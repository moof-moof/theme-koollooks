<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<!--  
https://github.com/moof-moof/theme-koollooks
-->
<fontconfig>

	<match target="font">
	
		<test name="family" qual="any" compare="eq">
			<string>Geneva 9.1</string>
		</test>
		
		<edit mode="assign" name="antialias">
			<bool>false</bool>
		</edit>
		
		<edit mode="assign" name="hinting">
			<bool>true</bool>
		</edit>
		
		<edit name="hintstyle" mode="append">
	<!--<edit name="hintstyle" mode="assign">-->
			<const>hintslight</const>
		</edit>
	
	</match>
	
	<match target="font">
	
		<test name="family" qual="any" compare="eq">
			<string>Chicago Kare</string>
		</test>
		
		<edit mode="assign" name="antialias">
			<bool>false</bool>
		</edit>
		
		<edit mode="assign" name="hinting">
			<bool>true</bool>
		</edit>
		
	</match>
  
</fontconfig>
